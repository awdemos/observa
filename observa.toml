# Default config for local development. Leave llm_api_key unset to use the
# built-in rule-based fallback responder; set it (even to a dummy value like
# "unused" for a local llama-server) to opt into the OpenAI-compatible client.
bind_addr = "127.0.0.1:3000"
llm_api_base = "http://localhost:8080/v1"
llm_model = "llama"
sample_interval_ms = 2000
log_source = "journald"
log_tail = true
# Optional: remote AI inference endpoints to monitor as part of the fleet.
# Each endpoint must expose an OpenAI-compatible `/v1/models` route.
# If no [[ai_server]] entries are configured, Observa only shows local servers.
# ai_server_poll_interval_ms = 10000
# ai_server_probe_timeout_ms = 5000
